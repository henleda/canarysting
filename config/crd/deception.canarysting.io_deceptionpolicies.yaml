---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: deceptionpolicies.deception.canarysting.io
spec:
  group: deception.canarysting.io
  names:
    categories:
    - canarysting
    kind: DeceptionPolicy
    listKind: DeceptionPolicyList
    plural: deceptionpolicies
    shortNames:
    - decpol
    singular: deceptionpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .status.seededCount
      name: Seeded
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DeceptionPolicy declares decoys to plant near a set of workloads. In the M1
          skeleton the operator VALIDATES the policy and reports status; it plants no
          decoys and takes no destructive cluster action.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DeceptionPolicySpec declares decoys to plant near a set of
              workloads.
            properties:
              decoys:
                description: |-
                  Decoys are the decoy types (and counts) to plant. At least one is required;
                  each Type is validated against the canary catalog by the operator.
                items:
                  description: DecoySpec is one decoy type and how many instances
                    to plant.
                  properties:
                    count:
                      default: 1
                      description: Count is how many instances to plant.
                      format: int32
                      minimum: 1
                      type: integer
                    type:
                      description: |-
                        Type is a canary catalog decoy type (e.g. "fake_secret", "planted_credential",
                        "decoy_file", "fake_bucket", "fake_endpoint"). Unknown types are rejected.
                      type: string
                  required:
                  - type
                  type: object
                minItems: 1
                type: array
              scope:
                description: |-
                  Scope optionally overrides the derived scope key for this policy. When empty,
                  the operator's identity-derived scope is used. Prototype: recorded but not yet
                  consumed (the seeding path is wired in the canary milestone, M2).
                type: string
              selector:
                description: Selector chooses the workloads near which decoys are
                  planted.
                properties:
                  labelSelector:
                    description: |-
                      LabelSelector narrows the target workloads. An empty selector (no matchLabels
                      and no matchExpressions) matches all and is not treated as "set".
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  namespace:
                    description: Namespace, if set, must equal the DeceptionPolicy's
                      own namespace.
                    type: string
                type: object
            required:
            - decoys
            - selector
            type: object
          status:
            description: DeceptionPolicyStatus reports the observed state of a DeceptionPolicy.
            properties:
              conditions:
                description: |-
                  Conditions describe the policy state. The "Accepted" condition is True when
                  the spec validates.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the spec generation the operator
                  last reconciled.
                format: int64
                type: integer
              seededCount:
                description: |-
                  SeededCount is how many decoy instances are currently planted. It is always 0
                  in the M1 skeleton — decoy seeding is wired in the canary milestone (M2).
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
