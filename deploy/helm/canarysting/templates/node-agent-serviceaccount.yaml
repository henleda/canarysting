{{- if and .Values.nodeAgent.enabled .Values.nodeAgent.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "canarysting.nodeAgent.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "canarysting.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
  {{- with .Values.nodeAgent.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end -}}
