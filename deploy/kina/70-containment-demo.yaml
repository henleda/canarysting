# Phase 3 containment demo: unlike l7-gate (50-jobs.yaml), which hits ONE
# canary path 5x and never escalates past the first tier, this Job touches 4
# DISTINCT canary paths on a single keep-alive curl connection — the repeated
# touches from one attacker identity across different canaries is what drives
# the engine's tier climb (0 -> 1 -> 2 -> 3) to the kernel jail. A single curl
# invocation with multiple URLs against the same host:port reuses one TCP
# connection by default, so all four touches share the same flow identity.
apiVersion: batch/v1
kind: Job
metadata:
  name: containment-demo
  namespace: canarysting
  labels:
    app: containment-demo
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: containment-demo
    spec:
      restartPolicy: Never
      containers:
        - name: curl
          image: curlimages/curl:latest
          command:
            - "sh"
            - "-c"
            - |
              echo "containment demo: 4 distinct canary paths, one keep-alive connection"
              # No `set -e`: the 4th (fake_bucket) touch is expected to drive the
              # engine to tier 3 and get jailed — the connection reset that
              # produces (curl exit != 0, code=000) IS the demo payoff, not a
              # script failure. Each URL gets its own -o/-w pair so curl doesn't
              # silently spill later bodies to stdout when only one -o is given
              # for multiple URLs.
              curl --max-time 10 -s \
                -o /dev/null -w 'code=%{http_code}\n' http://gateway:8080/.aws/credentials \
                -o /dev/null -w 'code=%{http_code}\n' http://gateway:8080/.env \
                -o /dev/null -w 'code=%{http_code}\n' http://gateway:8080/backup/db.sql \
                -o /dev/null -w 'code=%{http_code}\n' http://gateway:8080/internal/buckets
              exit 0
