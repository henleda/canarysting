apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: canarysting
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.34.1
          command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5

        - name: adapter
          image: docker.io/canarysting/core:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/cs-adapter"]
          args:
            - "-listen"
            - ":50051"
            - "-engine"
            - "127.0.0.1:50052"
            - "-scope"
            - "demo-scope"
            - "-inline"
            - "-sting-floor"
            - "1"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 2
            periodSeconds: 5
          # Real eBPF (no -no-ebpf) needs a privileged loader with root +
          # kernel-facing capabilities — the sockops/enforce programs attach
          # via bpf(2)/BPF_PROG_LOAD which the default hardened profile
          # (runAsNonRoot/65532/drop ALL) cannot do. This is the honest
          # tradeoff for real kernel-level canary-touch detection on the
          # BTF-kernel demo cluster; the hardened profile returns once the
          # loader can drop privileges after attach.
          securityContext:
            privileged: true
            capabilities:
              add: ["BPF", "NET_ADMIN", "PERFMON", "SYS_ADMIN", "SYS_RESOURCE"]
          volumeMounts:
            - name: cgroup
              mountPath: /sys/fs/cgroup
            - name: kernel
              mountPath: /sys/kernel
              readOnly: true
            - name: bpffs
              mountPath: /sys/fs/bpf

        - name: engine
          image: docker.io/canarysting/core:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/cs-engine"]
          args:
            - "-scope-boundary"
            - "demo-scope"
            - "-grpc-addr"
            - "127.0.0.1:50052"
            - "-aggressive"
          # No readinessProbe: -grpc-addr is 127.0.0.1:50052 (loopback-only, by
          # design — co-location is what lets the adapter dial the engine in
          # plaintext without certs). kubelet's tcpSocket probe dials the Pod
          # IP, not container loopback, so a probe against 50052 can never
          # succeed here and would permanently block this pod's readiness
          # (and therefore the gateway Service's endpoints). The adapter
          # container's own readiness/traffic path is the real liveness signal
          # for this co-located engine.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: envoy-config
          configMap:
            name: envoy-config
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: kernel
          hostPath:
            path: /sys/kernel
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: canarysting
  labels:
    app: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
