apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: canarysting
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.34.1
          command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5

        - name: adapter
          image: docker.io/canarysting/core:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/cs-adapter"]
          args:
            - "-listen"
            - ":50051"
            - "-engine"
            - "127.0.0.1:50052"
            - "-scope"
            - "demo-scope"
            - "-inline"
            - "-sting-floor"
            - "1"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 2
            periodSeconds: 5
          # Real eBPF (no -no-ebpf) needs root + kernel-facing capabilities —
          # the sockops/enforce programs attach via bpf(2)/BPF_PROG_LOAD which
          # the default hardened profile (runAsNonRoot/65532/drop ALL) cannot
          # do. Minimal grant for this loader: CAP_BPF + CAP_NET_ADMIN to
          # load/attach the programs, CAP_SYS_RESOURCE to raise the memlock
          # rlimit bpf(2) needs. No privileged: true — this is the honest
          # tradeoff for real kernel-level canary-touch detection on the
          # BTF-kernel demo cluster.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              drop: ["ALL"]
              add: ["BPF", "NET_ADMIN", "SYS_RESOURCE"]
          volumeMounts:
            - name: cgroup
              mountPath: /sys/fs/cgroup
            - name: kernel
              mountPath: /sys/kernel
              readOnly: true

        - name: engine
          image: docker.io/canarysting/core:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/cs-engine"]
          args:
            - "-scope-boundary"
            - "demo-scope"
            - "-grpc-addr"
            - "127.0.0.1:50052"
            - "-aggressive"
            - "-dashboard-tap-addr"
            - "0.0.0.0:8088"
            - "-baseline-db"
            - "/data/baseline.db"
          ports:
            - name: tap
              containerPort: 8088
          # No readinessProbe: -grpc-addr is 127.0.0.1:50052 (loopback-only, by
          # design — co-location is what lets the adapter dial the engine in
          # plaintext without certs). kubelet's tcpSocket probe dials the Pod
          # IP, not container loopback, so a probe against 50052 can never
          # succeed here and would permanently block this pod's readiness
          # (and therefore the gateway Service's endpoints). The adapter
          # container's own readiness/traffic path is the real liveness signal
          # for this co-located engine.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: baseline-db
              mountPath: /data

      volumes:
        - name: envoy-config
          configMap:
            name: envoy-config
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: kernel
          hostPath:
            path: /sys/kernel
        - name: baseline-db
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: canarysting
  labels:
    app: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: tap
      port: 8088
      targetPort: 8088
