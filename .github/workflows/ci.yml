name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1-6"
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      level:
        description: Validation level
        type: choice
        options: [pr, integration, campaign]
        default: pr
      risk:
        description: Optional risk increase
        type: choice
        options: [auto, LOW, STANDARD, HIGH, CRITICAL]
        default: auto

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  risk:
    name: risk classification and path selection
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.level == 'pr')
    runs-on: ubuntu-latest
    outputs:
      risk: ${{ steps.classify.outputs.risk }}
      executable: ${{ steps.classify.outputs.executable }}
      requires_privileged: ${{ steps.classify.outputs.requires_privileged }}
      requires_dgx: ${{ steps.classify.outputs.requires_dgx }}
      requires_live_qwen: ${{ steps.classify.outputs.requires_live_qwen }}
      frontend: ${{ steps.classify.outputs.frontend }}
      ebpf: ${{ steps.classify.outputs.ebpf }}
      gate: ${{ steps.classify.outputs.gate }}
      remote_profiles: ${{ steps.classify.outputs.remote_profiles }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Classify automatic and manually increased risk
        id: classify
        shell: bash
        run: |
          manual=''
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            labels="$(jq -r '[.pull_request.labels[].name] | join(" ")' "$GITHUB_EVENT_PATH")"
            case " ${labels} " in
              *' risk:critical '*) manual='CRITICAL' ;;
              *' risk:high '*) manual='HIGH' ;;
              *' risk:standard '*) manual='STANDARD' ;;
              *' risk:low '*) manual='LOW' ;;
            esac
          elif [[ '${{ inputs.risk }}' != 'auto' ]]; then
            manual='${{ inputs.risk }}'
          fi
          make check-risk RISK="${manual}" GITHUB_OUTPUT_FILE="$GITHUB_OUTPUT"
      - name: Upload risk decision
        uses: actions/upload-artifact@v4
        with:
          name: gate-risk-${{ github.event.pull_request.number || github.run_id }}
          path: .test-artifacts/gates/risk.json
          if-no-files-found: error

  pr-local:
    name: Level 2 local (${{ needs.risk.outputs.risk }})
    needs: risk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up pinned protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "35.0"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Set up Node.js 24 LTS when affected
        if: needs.risk.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: dashboard/app/package-lock.json
      - name: Install locked frontend dependencies when affected
        if: needs.risk.outputs.frontend == 'true'
        working-directory: dashboard/app
        run: npm ci
      - name: Install eBPF build prerequisites when affected
        if: needs.risk.outputs.ebpf == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev gcc make pkg-config git libelf-dev zlib1g-dev
      - name: Provide bpftool and vmlinux.h when eBPF is affected
        if: needs.risk.outputs.ebpf == 'true'
        shell: bash
        run: |
          tool=''
          for candidate in /usr/sbin/bpftool $(find /usr/lib /usr/local -type f -name bpftool 2>/dev/null); do
            if "$candidate" version >/dev/null 2>&1; then tool="$candidate"; break; fi
          done
          if [[ -z "$tool" ]]; then
            repo=https://github.com/libbpf/bpftool.git
            tag="$(git ls-remote --tags --refs "$repo" 'v*' | awk -F/ '{print $NF}' | sort -V | tail -n1)"
            git clone --depth 1 --branch "$tag" --recurse-submodules "$repo" "$RUNNER_TEMP/bpftool"
            make -C "$RUNNER_TEMP/bpftool/src" -j"$(nproc)"
            tool="$RUNNER_TEMP/bpftool/src/bpftool"
          fi
          "$tool" btf dump file /sys/kernel/btf/vmlinux format c > "$RUNNER_TEMP/vmlinux.h"
          for directory in $(find bpf -name '*.bpf.c' -exec dirname {} \; | sort -u); do
            cp "$RUNNER_TEMP/vmlinux.h" "$directory/vmlinux.h"
          done
      - name: Run authoritative shared Level 2 definitions
        run: make check-pr RISK='${{ needs.risk.outputs.risk }}'
      - name: Upload failed Level 2 evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-pr-local-${{ github.event.pull_request.number || github.run_id }}
          path: .test-artifacts/gates/
          if-no-files-found: error

  pr-ebpf-privileged:
    name: Level 2 selected privileged eBPF
    needs: [risk, pr-local]
    if: needs.risk.outputs.requires_privileged == 'true'
    runs-on: ubuntu-latest
    container:
      image: golang:1.24-bookworm
      options: --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run shared privileged check definition
        run: make check-ci-ebpf-privileged
      - name: Upload failed privileged evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-pr-ebpf-privileged-${{ github.event.pull_request.number || github.run_id }}
          path: .test-artifacts/gates/
          if-no-files-found: error

  pr-dgx:
    name: Level 2 selected DGX smoke
    needs: [risk, pr-local]
    if: needs.risk.outputs.requires_dgx == 'true'
    runs-on: [self-hosted, canarysting-dgx-controller]
    timeout-minutes: 20
    concurrency:
      group: dgx-pr-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The persistent controller already retains its local Go caches. Do
          # not upload the controller user's global multi-project cache.
          cache: false
      - name: Map every conservative classifier output to a bounded DGX profile
        id: profiles
        shell: bash
        env:
          REMOTE_PROFILES: ${{ needs.risk.outputs.remote_profiles }}
        run: |
          selected_profiles=''
          IFS=',' read -ra required_profiles <<< "${REMOTE_PROFILES}"
          for required in "${required_profiles[@]}"; do
            case "${required}" in
              dgx-kernel) selected='kernel-full' ;;
              dgx-enforcement) selected='enforcement' ;;
              dgx-trace) selected='trace' ;;
              dgx-attacker-check) selected='attacker-check' ;;
              dgx-attacker-executor) selected='attacker-executor' ;;
              dgx-harness) selected='preflight' ;;
              *)
                echo "No implemented bounded DGX profile for ${required}; refusing weaker substitution" >&2
                exit 2
                ;;
            esac
            case " ${selected_profiles} " in
              *" ${selected} "*) ;;
              *) selected_profiles="${selected_profiles:+${selected_profiles} }${selected}" ;;
            esac
          done
          [[ -n "${selected_profiles}" ]] || { echo 'No DGX profile was selected' >&2; exit 2; }
          echo "profiles=${selected_profiles}" >> "$GITHUB_OUTPUT"
      - name: Run each required bounded DGX profile with exact cleanup
        env:
          SELECTED_PROFILES: ${{ steps.profiles.outputs.profiles }}
        run: |
          short_sha="${GITHUB_SHA:0:10}"
          index=0
          for selected in ${SELECTED_PROFILES}; do
            index=$((index + 1))
            make check-dgx-smoke DGX_PROFILE="${selected}" RUN_ID="pr-${{ github.event.pull_request.number || github.run_id }}-${short_sha}-${index}"
          done

  pr-gate:
    name: authoritative Level 2 PR gate
    needs: [risk, pr-local, pr-ebpf-privileged, pr-dgx]
    if: always() && needs.risk.result != 'skipped'
    runs-on: ubuntu-latest
    env:
      LOCAL_RESULT: ${{ needs.pr-local.result }}
      PRIVILEGED_RESULT: ${{ needs.pr-ebpf-privileged.result }}
      DGX_RESULT: ${{ needs.pr-dgx.result }}
      REQUIRES_PRIVILEGED: ${{ needs.risk.outputs.requires_privileged }}
      REQUIRES_DGX: ${{ needs.risk.outputs.requires_dgx }}
      EFFECTIVE_RISK: ${{ needs.risk.outputs.risk }}
    steps:
      - name: Require every automatically selected job
        shell: bash
        run: |
          echo "risk=${EFFECTIVE_RISK} local=${LOCAL_RESULT} privileged=${PRIVILEGED_RESULT} dgx=${DGX_RESULT}"
          [[ "${LOCAL_RESULT}" == 'success' ]]
          if [[ "${REQUIRES_PRIVILEGED}" == 'true' ]]; then [[ "${PRIVILEGED_RESULT}" == 'success' ]]; fi
          if [[ "${REQUIRES_DGX}" == 'true' ]]; then [[ "${DGX_RESULT}" == 'success' ]]; fi

  integration-local:
    name: Level 3 complete local qualification
    if: >-
      github.event_name == 'push' || github.event_name == 'merge_group' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.level == 'integration' || inputs.level == 'campaign'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: dashboard/app/package-lock.json
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "35.0"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install locked build prerequisites once
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          npm --prefix dashboard/app ci
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev gcc make pkg-config git libelf-dev zlib1g-dev
          tool=''
          for candidate in /usr/sbin/bpftool $(find /usr/lib /usr/local -type f -name bpftool 2>/dev/null); do
            if "$candidate" version >/dev/null 2>&1; then tool="$candidate"; break; fi
          done
          if [[ -z "$tool" ]]; then
            repo=https://github.com/libbpf/bpftool.git
            tag="$(git ls-remote --tags --refs "$repo" 'v*' | awk -F/ '{print $NF}' | sort -V | tail -n1)"
            git clone --depth 1 --branch "$tag" --recurse-submodules "$repo" "$RUNNER_TEMP/bpftool"
            make -C "$RUNNER_TEMP/bpftool/src" -j"$(nproc)"
            tool="$RUNNER_TEMP/bpftool/src/bpftool"
          fi
          "$tool" btf dump file /sys/kernel/btf/vmlinux format c > "$RUNNER_TEMP/vmlinux.h"
          for directory in $(find bpf -name '*.bpf.c' -exec dirname {} \; | sort -u); do
            cp "$RUNNER_TEMP/vmlinux.h" "$directory/vmlinux.h"
          done
      - name: Run complete shared Level 3 local graph
        run: make check-integration-full
      - name: Upload Level 3 evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-integration-local-${{ github.run_id }}
          path: .test-artifacts/gates/
          if-no-files-found: error

  integration-dgx:
    name: Level 3 complete implemented DGX matrix
    needs: integration-local
    runs-on: [self-hosted, canarysting-dgx-controller]
    concurrency:
      group: dgx-integration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The persistent controller already retains its local Go caches. Do
          # not upload the controller user's global multi-project cache.
          cache: false
      - name: Run full implemented DGX matrix once
        run: |
          short_sha="${GITHUB_SHA:0:10}"
          make check-dgx-smoke DGX_PROFILE=kernel-full RUN_ID="integration-${GITHUB_RUN_ID}-${short_sha}"

  campaign:
    name: Level 4 soak and live campaign qualification
    needs: [integration-local, integration-dgx]
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 3 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.level == 'campaign')
    runs-on: [self-hosted, canarysting-dgx-controller]
    concurrency:
      group: dgx-campaign
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require the bounded live Qwen campaign implementation
        run: scripts/dgx/pr.sh --profile campaign --run-id "campaign-${GITHUB_RUN_ID}"
